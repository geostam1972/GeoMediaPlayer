name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MediaPlayer.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayer-apk
          path: MediaPlayer.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Media Player 1.0.${{ github.run_number }}
          body: |
            Άνοιξε αυτή τη σελίδα από το κινητό και πάτα MediaPlayer.apk για να το εγκαταστήσεις.
          files: MediaPlayer.apk
          make_latest: true
